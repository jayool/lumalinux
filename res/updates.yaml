# ─────────────────────────────────────────────────────────────────────────────
# Builds — ADDITIVE (v0.16). Maps each whitelisted steamclient.so SHA-256 to its
# Steam build metadata and the pattern group it uses. Ignored by pre-v0.16
# readers (update.cpp reads only SafeModeHashes above).
#   • lumalinux runtime: sha256 -> pattern_group  (applyPatternOverrides)
#   • LumaDeck gate:      steam_version -> supported?  (safe-to-update-Steam)
# steam_version is the integer from Steam's client manifest (the value
# headcrab_compat/LumaDeck speak). Backfill it for older hashes as builds recur;
# pattern_group is what the runtime needs and is known for all.
# ─────────────────────────────────────────────────────────────────────────────
