# res/updates.yaml — runtime-fetched config shared by lumalinux + LumaDeck.
#
# SafeModeHashes is the single source of truth and the ONLY thing lumalinux's
# runtime reads (src/update.cpp): the flat list of steamclient.so SHA-256s it is
# allowed to hook, grouped by pattern-set version. The group id (a timestamp)
# bumps ONLY when src/patterns.hpp changes; within a group, new compatible hashes
# are just appended — no rebuild, no release, deployed binaries accept them on
# next boot.
#
# The `# steam_version:` comment on a hash is NOT read by lumalinux. It is read by
# LumaDeck's safe-to-update-Steam gate, which does a dependency-free TEXT SCAN of
# this file for `steam_version: <pin>` to answer "is this Steam build supported?".
# So that metadata lives as a comment next to its hash — one section, no sidecar.
# Added by whitelist_hash.py --steam-version; harmless to omit (the gate just
# returns "unknown" for that build).
#
# A `# caps: shader=ok reconcile=moved` comment follows the same convention (also
# ignored by lumalinux, text-scanned by LumaDeck): it records which NON-CRITICAL
# hooks resolved on that build — `shader` = the per-game shader-cache skip,
# `reconcile` = no-restart Add Game — so LumaDeck's update gate knows which
# features a build would lose (`moved` = pattern didn't resolve; `ok` = healthy).
# Added by whitelist_hash.py --caps. Hashes whitelisted before this feature have
# no caps line — the gate treats that as "unknown", not "reduced".
#
# Hashes are the ubuntu12_32 / steamdeck_stable_ubuntu12 binary actually LOADED at
# runtime (NOT linux32). watch-steam.yml validates + appends them automatically.
SafeModeHashes:
