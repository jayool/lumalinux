# ─────────────────────────────────────────────────────────────────────────────
# PatternGroups — ADDITIVE (v0.16). The fetchable byte-pattern set per group.
# A group == one pattern set == the SafeMode VERSION that only bumps when
# patterns.hpp changes. lumalinux loads the group its hash maps to, OVERRIDING
# the compiled-in defaults; falls back to compiled-in on any miss. Each pattern
# is a string, or a map { pattern: "...", match_index: N } (LoadPackage only).
# Values below are the v0.16 compiled-in patterns (patterns.hpp) — publishing
# them here exercises the override path and lets a future build reuse the group.
