    # v0.22.0 pattern set: finder layout table (0xc58 stable / 0xf90 beta),
    # frame-agnostic GMRC tail, register-agnostic Reconcile, frame-agnostic
    # GMRC. Only builds verified WITH THIS SET are listed here — the older
    # hashes below stay under their own group (their binaries are no longer
    # downloadable, so they cannot be re-checked; the deployed .so treats an
    # unlisted hash as a log notice, not a refusal).
