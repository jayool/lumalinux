    # 20260611 group below): the Deck stable manifest was relabelled 1788652215
    # on 2026-09-05 without changing steamclient.so (watch-steam run 75). The
    # DESKTOP stable carries the same label with a different file (237495b4…),
    # so the version number alone never identifies a build; the hash does.
    # Both labels are annotated on purpose: headcrab's pinned manifest
