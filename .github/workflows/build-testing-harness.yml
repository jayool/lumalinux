name: Build Testing Harness

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing-harness

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap curl wget p7zip-full zstd

      - name: Download Steam .deb from steampowered.com (network UNBLOCKED here)
        run: |
          mkdir -p out
          wget -q https://repo.steampowered.com/steam/archive/stable/steam_latest.deb -O out/steam.deb
          ls -la out/

      - name: Extract Steam binary tree
        run: |
          mkdir -p steam-extract
          dpkg-deb -x out/steam.deb steam-extract
          # El runtime bootstrapping de Steam: el .deb instala el launcher,
          # la primera ejecución descarga el ubuntu12_32. Aquí solo tenemos el launcher.
          # Para obtener ubuntu12_32 directamente:
          mkdir -p steam-runtime
          # Steam bootstrap tarball (lo que el .deb extrae en ~/.local/share/Steam)
          wget -q https://media.steampowered.com/client/installer/steam.tar.gz -O steam-runtime/bootstrap.tar.gz
          ls -lh steam-runtime/
          # Comprimir solo bootstrap.tar.gz como nuestro paquete steam_bootstrap
          tar czf out/steam_bootstrap.tar.gz -C steam-runtime bootstrap.tar.gz

      - name: Pull Arch Linux container and extract 32-bit libs (similar to SteamOS)
        run: |
          docker pull archlinux:latest
          docker run --rm -v $PWD/out:/out archlinux:latest bash -c "
            pacman -Sy --noconfirm lib32-glibc lib32-gcc-libs lib32-openssl lib32-libcurl-gnutls lib32-libcurl-compat 2>&1 | tail -5 || true
            mkdir -p /libs32
            cp -L /usr/lib32/libc.so.6 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libpthread.so* /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libdl.so* /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libgcc_s.so* /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libstdc++.so* /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libcrypto.so.3 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libssl.so.3 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libcurl.so.4 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libm.so.6 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/libresolv.so.2 /libs32/ 2>/dev/null || true
            cp -L /usr/lib32/ld-linux.so.2 /libs32/ 2>/dev/null || true
            ls -la /libs32/
            tar czf /out/archlinux_libs32.tar.gz -C /libs32 .
          "
          ls -la out/

      - name: Download all needed .so binaries (SLSsteam + CR + lumalinux) from GitHub releases
        run: |
          mkdir -p sos
          # SLSsteam
          TAG=$(curl -sSL -o /dev/null -w "%{url_effective}" "https://github.com/AceSLS/SLSsteam/releases/latest")
          TAG="${TAG##*/}"
          wget -q "https://github.com/AceSLS/SLSsteam/releases/download/$TAG/SLSsteam-Any.7z" -O sos/SLSsteam.7z
          cd sos && 7z x -y SLSsteam.7z >/dev/null && cd ..
          mv sos/bin/SLSsteam.so sos/
          mv sos/bin/library-inject.so sos/
          # CloudRedirect
          wget -q https://github.com/Selectively11/h3adcr-b/releases/download/linux-test/cloud_redirect.so -O sos/cloud_redirect.so
          # lumalinux
          LL_TAG=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/jayool/lumalinux/releases/latest" | jq -r .tag_name)
          wget -q "https://github.com/jayool/lumalinux/releases/download/$LL_TAG/liblumalinux.so" -O sos/liblumalinux.so
          ls -la sos/*.so
          tar czf out/sos_binaries.tar.gz -C sos SLSsteam.so library-inject.so cloud_redirect.so liblumalinux.so

      - name: Build a minimal "fake steam" test harness binary in 32-bit
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev:i386 libcurl4-openssl-dev:i386 libpthread-stubs0-dev:i386
          mkdir -p harness
          cat > harness/steam.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <curl/curl.h>
          static size_t wr(const char* d, size_t s, size_t n, void* p){(void)d;(void)p;return s*n;}
          static void* w(void* a){(void)a;for(int i=0;i<3;i++){CURL* c=curl_easy_init();if(!c)break;
            curl_easy_setopt(c,CURLOPT_URL,"https://www.google.com/");
            curl_easy_setopt(c,CURLOPT_WRITEFUNCTION,wr);
            curl_easy_setopt(c,CURLOPT_TIMEOUT,5L);
            curl_easy_setopt(c,CURLOPT_SSL_VERIFYPEER,0L);
            curl_easy_perform(c);curl_easy_cleanup(c);usleep(200000);}return NULL;}
          int main(void){fprintf(stderr,"[steam] pid=%d\n",getpid());
            pthread_t t[3];for(int i=0;i<3;i++)pthread_create(&t[i],NULL,w,NULL);
            sleep(5);for(int i=0;i<3;i++)pthread_join(t[i],NULL);
            fprintf(stderr,"[steam] returning\n");return 0;}
          EOF
          gcc -m32 -no-pie -o harness/steam harness/steam.c -lpthread -lcurl
          file harness/steam
          cat > harness/fix_atexit.c <<'EOF'
          #include <stdlib.h>
          #include <unistd.h>
          static void e(void){_exit(0);}
          __attribute__((constructor)) static void r(void){atexit(e);}
          EOF
          gcc -m32 -shared -fPIC -o harness/fix_atexit.so harness/fix_atexit.c
          file harness/fix_atexit.so
          tar czf out/harness.tar.gz -C harness steam fix_atexit.so steam.c fix_atexit.c

      - name: Upload to test-deps-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload test-deps-v1 out/*.tar.gz out/*.deb --repo jayool/lumalinux --clobber

      - name: Summary
        run: |
          echo "## Assets subidos al release test-deps-v1" >> $GITHUB_STEP_SUMMARY
          ls -la out/ >> $GITHUB_STEP_SUMMARY
