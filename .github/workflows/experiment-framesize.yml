# Throwaway manual experiment for issue #16: empirically check whether
# wildcarding the stack-frame size makes the critical patterns collide, against
# the REAL current steamclient.so (Valve's CDN is firewalled from the dev
# sandbox, so this can only run on a GitHub runner). Manual-only; delete after use.
name: experiment-framesize

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/experiment-framesize.yml']

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the current steamclient.so (steamdeck_stable)
        run: |
          python3 tools/fetch_steamclient.py --output steamclient.so
          ls -la steamclient.so

      - name: Frame-size mask experiment
        run: |
          echo "patterns.hpp under test:"
          grep -nE 'k(DepotKeyFn|BuildDepotDependency|GmrcFunction|LoadPackage)Pattern' src/patterns.hpp || true
          echo
          python3 tools/experiment_framesize_mask.py steamclient.so --hpp src/patterns.hpp

      - name: Cross-check with check_patterns (baseline sanity)
        run: python3 tools/check_patterns.py steamclient.so || true
