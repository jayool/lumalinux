name: watch-steam

# Daily monitor: detect a new Steam client, fetch its 32-bit steamclient.so, and
# check whether lumalinux's hooks still resolve — so a Steam update never catches
# us by surprise. Two-level gate keeps it cheap: a featherweight version check
# runs every day; the heavy download + validation only fire when Steam actually
# updated (cron triggers daily, but real work happens only on a new version).
#
# Outcomes (driven by tools/check_patterns.py exit code):
#   CLEAN (0)            -> open a PR adding the hash to res/updates.yaml (A.1).
#                          Merging propagates to every Deck on next boot, no
#                          release (updates.yaml is fetched live at startup).
#   ShaderDepot (2)      -> same PR + open an issue to re-derive ShaderDepot.
#   blocking (3)         -> open an issue (a critical hook or finder anchor
#                          moved: A.2 / C). Do NOT whitelist.
#
# The live download path runs on the GitHub runner (open internet); it could not
# be exercised from the dev sandbox (Valve's CDN is firewalled there), so treat
# the first manual run as the end-to-end validation of tools/fetch_steamclient.py.

on:
  schedule:
    - cron: '17 7 * * *'      # daily 07:17 UTC (off the top of the hour)
  workflow_dispatch:

permissions:
  contents: write             # push the PR branch + commit updates.yaml
  pull-requests: write        # open the hash-bump PR
  issues: write               # open A.2/C and ShaderDepot issues

concurrency:
  group: watch-steam
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ── Level 1: cheap version gate ──────────────────────────────────────
      - name: Get current Steam client version
        id: ver
        run: |
          V=$(python3 tools/fetch_steamclient.py --version-only)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > .watch-steam-seen
          echo "Steam client version: $V"

      - name: Have we already processed this version?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .watch-steam-seen
          # v2 prefix: bumping it invalidates every pre-existing entry (the old
          # `steam-client-<ver>` keys become unreachable). Bumped when the
          # save-semantics below changed AND to bust a poisoned entry — a version
          # cached while its hash was only transiently whitelisted.
          key: steam-client-v2-${{ steps.ver.outputs.version }}

      # ── Level 2: only on a NEW version ───────────────────────────────────
      - name: Download latest steamclient.so
        id: dl
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          OUT=$(python3 tools/fetch_steamclient.py --output steamclient.so)
          SHA=${OUT#sha256=}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "steamclient.so SHA-256: $SHA"

      - name: Already whitelisted?
        id: wl
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          if grep -qiF "${{ steps.dl.outputs.sha }}" res/updates.yaml; then
            echo "whitelisted=true" >> "$GITHUB_OUTPUT"
            echo "Hash already in res/updates.yaml — nothing to do."
          else
            echo "whitelisted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate patterns
        id: check
        if: steps.seen.outputs.cache-hit != 'true' && steps.wl.outputs.whitelisted == 'false'
        run: |
          set +e
          python3 tools/check_patterns.py steamclient.so --json result.json > report.txt 2>&1
          code=$?
          set -e
          cat report.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      # ── CLEAN (0) or ShaderDepot-moved (2): PR the hash ──────────────────
      - name: Open hash-bump PR (auto-merged on CLEAN)
        id: pr
        if: steps.check.outcome == 'success' && (steps.check.outputs.exit == '0' || steps.check.outputs.exit == '2')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          VER: ${{ steps.ver.outputs.version }}
          EXIT: ${{ steps.check.outputs.exit }}
        run: |
          SHORT=${SHA:0:8}
          BR="watch-steam/hash-$SHORT"
          if [ "$(gh pr list --state all --search "$SHORT" --json number --jq 'length')" != "0" ]; then
            echo "A PR for $SHORT already exists — skipping."; exit 0
          fi
          # Per-build non-critical capabilities (shader=ok/moved reconcile=ok/moved)
          # recorded next to the hash so LumaDeck's update gate knows what a build
          # would lose. On a CLEAN check all are ok; on exit 2 the moved one is flagged.
          CAPS=$(python3 -c "import json;print(json.load(open('result.json')).get('caps_str',''))")
          python3 tools/whitelist_hash.py "$SHA" --steam-version "$VER" --caps "$CAPS" --note "auto-added by watch-steam.yml $(date -u +%Y-%m-%d): patterns verified by CI
          (Steam client version $VER). Live-install test on a Deck still recommended."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add res/updates.yaml
          git commit -m "chore(SafeMode): whitelist steamclient $SHORT (CI: patterns verified)"
          git push -u origin "$BR"
          {
            echo "Automated by \`watch-steam.yml\`. A new Steam client shipped and"
            echo "**all critical patterns still resolve** against its 32-bit \`steamclient.so\`,"
            echo "so this is an **A.1 hash bump** — no rebuild, no release. This PR is"
            echo "**auto-merged** by CI and propagates to every Deck on next boot"
            echo "(\`updates.yaml\` is fetched live at startup)."
            echo
            echo "- Steam client version: \`$VER\`"
            echo "- steamclient.so SHA-256: \`$SHA\`"
            if [ "$EXIT" = "2" ]; then
              echo "- ⚠️ **ShaderDepot pattern moved** (non-critical: installs still work, only"
              echo "  the per-game shader-skip is lost). A separate issue tracks re-deriving it."
            fi
            echo
            echo "Auto-merged on a CLEAN check; a live-install test on a Deck is still worth"
            echo "doing to confirm 4/4 hooks."
            echo
            echo '<details><summary>check_patterns.py report</summary>'
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo '</details>'
          } > pr_body.md
          gh pr create --base main --head "$BR" \
            --title "SafeMode: whitelist steamclient $SHORT (auto, patterns verified)" \
            --body-file pr_body.md
          # Auto-merge: a CLEAN / ShaderDepot-moved hash bump is a safe, review-free
          # DATA change (deployed .so self-heals on the fetched hash; no code change).
          # main is unprotected, so this squash-merges without waiting on checks.
          # Merge WITHOUT --delete-branch, then drop the REMOTE branch explicitly.
          # `gh pr merge --delete-branch` also deletes the LOCAL branch, which needs
          # a current branch to switch to; the old code detached HEAD off "$BR"
          # first so the local delete could run, but gh in detached HEAD then errors
          # "could not determine current branch" AFTER a successful merge — failing
          # the step (red run) on a job that actually worked. The local branch is
          # throwaway on this ephemeral runner, so only the remote one needs cleanup.
          gh pr merge "$BR" --squash
          git push origin --delete "$BR" || true
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # ── non-critical moved (2): try AUTO-DERIVATION first ────────────────
      # The heavy Ghidra path runs ONLY here, on a real "pattern moved" event —
      # never on the daily happy path — so the multi-minute analysis cost is
      # paid only when there's real re-derivation work. We re-derive whichever
      # non-critical pattern(s) moved (ShaderDepot and/or Reconcile — the exact
      # consts come from check_patterns' noncritical_moved_consts), apply them to
      # patterns.hpp, and re-validate; on success we open a PR (a SOURCE change
      # that needs a release), otherwise we fall back to the tracking issue below.
      - name: Set up Java for auto-derive
        if: steps.check.outcome == 'success' && (steps.check.outputs.exit == '2' || steps.check.outputs.exit == '3')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Auto-derive moved non-criticals
        id: derive
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "applied=false" >> "$GITHUB_OUTPUT"
          # Which non-critical const(s) actually moved (ShaderDepot / Reconcile).
          # A single Ghidra run derives whatever it can; apply only the moved ones.
          ONLY=$(python3 -c "import json;print(','.join(json.load(open('result.json'))['noncritical_moved_consts']))")
          MOVED=$(python3 -c "import json;print(', '.join(json.load(open('result.json'))['noncritical_moved']))")
          echo "non-critical moved: ${MOVED:-<none>} -> deriving: ${ONLY:-<none>}"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "moved=$MOVED" >> "$GITHUB_OUTPUT"
          if [ -z "$ONLY" ]; then
            echo "no derivable non-critical const — falling back to issue."; exit 0
          fi
          # Reset to the base commit: the hash-bump step above committed
          # updates.yaml onto its own branch, so detach back to ${{ github.sha }}
          # to make sure the patterns.hpp change lands on a clean base. The
          # untracked steamclient.so download survives the checkout.
          git checkout -f ${{ github.sha }}
          set +e
          bash tools/run_ghidra_derive.sh steamclient.so derived.json
          dcode=$?
          set -e
          if [ "$dcode" -ne 0 ]; then
            echo "Ghidra derivation failed (exit $dcode) — falling back to issue."; exit 0
          fi
          set +e
          python3 tools/apply_derived_pattern.py --derived derived.json --only "$ONLY"
          acode=$?
          set -e
          if [ "$acode" -ne 0 ]; then
            echo "could not apply derived non-critical pattern(s) — falling back to issue."; exit 0
          fi
          # Re-validate against the live binary: patched header must be CLEAN (0).
          set +e
          python3 tools/check_patterns.py steamclient.so --json recheck.json > recheck.txt 2>&1
          rcode=$?
          set -e
          cat recheck.txt
          if [ "$rcode" -ne 0 ]; then
            echo "re-validation not CLEAN (exit $rcode) — falling back to issue."; exit 0
          fi
          if git diff --quiet -- src/patterns.hpp; then
            echo "no change produced — falling back to issue."; exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "non-critical(s) re-derived and re-validated CLEAN: $MOVED."

      - name: Open non-critical re-derive PR
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '2' && steps.derive.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          VER: ${{ steps.ver.outputs.version }}
          MOVED: ${{ steps.derive.outputs.moved }}
        run: |
          SHORT=${SHA:0:8}
          BR="watch-steam/noncritical-$SHORT"
          if [ "$(gh pr list --head "$BR" --state all --json number --jq 'length')" != "0" ]; then
            echo "A non-critical re-derive PR for $SHORT already exists — skipping."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add src/patterns.hpp
          git commit -m "fix(patterns): re-derive non-critical pattern(s) ($MOVED) for client $SHORT"
          git push -u origin "$BR"
          {
            echo "Automated by \`watch-steam.yml\`. On Steam client \`$VER\` (\`$SHORT\`) the"
            echo "non-critical pattern(s) **$MOVED** stopped matching, so the monitor ran the"
            echo "Ghidra headless derivation (\`derive_patterns.py\`), re-derived UNIQUE pattern(s),"
            echo "applied them to \`src/patterns.hpp\`, and \`check_patterns.py\` now reports **CLEAN**."
            echo
            echo "Unlike the hash-bump PR, **this changes a compiled pattern**, so it only takes"
            echo "effect after a **rebuild + release** — merging alone is not enough. These are"
            echo "non-critical (installs already work): ShaderDepot restores the per-game"
            echo "shader-skip; Reconcile restores no-restart Add Game. No rush, but a live-install"
            echo "test on a Deck is recommended first."
            echo
            echo "- Steam client version: \`$VER\`"
            echo "- steamclient.so SHA-256: \`$SHA\`"
            echo
            echo '<details><summary>re-validation (check_patterns.py after applying)</summary>'
            echo
            echo '```'
            cat recheck.txt
            echo '```'
            echo '</details>'
          } > pr_body_nc.md
          gh pr create --base main --head "$BR" \
            --title "fix(patterns): re-derived non-critical(s) $MOVED for client $SHORT (auto, needs release)" \
            --body-file pr_body_nc.md

      # ── non-critical moved (2) and auto-derive couldn't fix it: issue ────
      - name: Open non-critical moved issue
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '2' && steps.derive.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          VER: ${{ steps.ver.outputs.version }}
          MOVED: ${{ steps.derive.outputs.moved }}
        run: |
          SHORT=${SHA:0:8}
          TITLE="Non-critical pattern(s) moved on Steam client $SHORT ($MOVED)"
          if [ "$(gh issue list --state all --search "moved on Steam client $SHORT in:title" --json number --jq 'length')" != "0" ]; then
            echo "Issue already exists — skipping."; exit 0
          fi
          {
            echo "\`watch-steam.yml\` whitelisted Steam client \`$SHORT\` (version \`$VER\`) because"
            echo "the critical hooks still resolve, but the non-critical pattern(s) **$MOVED** no"
            echo "longer match uniquely. Non-blocking (installs work), but they should be re-derived:"
            echo "ShaderDepot = per-game shader-skip; Reconcile = no-restart Add Game."
            echo
            echo "The build was whitelisted with a \`# caps:\` note recording which non-criticals are"
            echo "down, so LumaDeck's update gate can warn about the reduced functionality."
            echo
            echo "**Auto-derivation was attempted and could not produce a clean pattern**"
            echo "(Ghidra run failed, the derived pattern wasn't unique, or re-validation"
            echo "didn't come back CLEAN), so this needs a human."
            echo
            echo "**Fix:** run \`derive_patterns.py\` in Ghidra against this build (it auto-derives"
            echo "ShaderDepot via the \`shadercachedepot\` string and Reconcile via the"
            echo "\`17LicensesUpdated_t\` RTTI anchor). Paste the fresh pattern(s) into"
            echo "\`src/patterns.hpp\`, rebuild, release."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > issue_body.md
          gh issue create --title "$TITLE" --body-file issue_body.md

      # ── blocking (3): try AUTO-DERIVATION of the moved critical hooks ────
      # Same Ghidra path as ShaderDepot, but for the string-anchored CRITICAL
      # hooks (BuildDep / GMRC, and DepotKey if the vcall walk resolves).
      # blocking_constants.py decides what's auto-derivable: if a finder anchor
      # moved (a code fix, not a pattern) or an unknown hook is blocking, it
      # prints nothing and we go straight to the issue. Unlike ShaderDepot this
      # NEVER whitelists — a broken critical means SafeMode must keep blocking
      # until the rebuilt .so ships, so the PR is a source fix that needs a
      # release.
      - name: Auto-derive blocking criticals
        id: derive3
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "applied=false" >> "$GITHUB_OUTPUT"
          ONLY=$(python3 tools/blocking_constants.py result.json)
          echo "auto-derivable blocking constants: '${ONLY:-<none>}'"
          if [ -z "$ONLY" ]; then
            echo "nothing auto-derivable (finder anchor or unknown hook) — issue."; exit 0
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          git checkout -f ${{ github.sha }}
          set +e
          bash tools/run_ghidra_derive.sh steamclient.so derived.json
          dcode=$?
          set -e
          if [ "$dcode" -ne 0 ]; then
            echo "Ghidra derivation failed (exit $dcode) — falling back to issue."; exit 0
          fi
          set +e
          python3 tools/apply_derived_pattern.py --derived derived.json --only "$ONLY"
          acode=$?
          set -e
          if [ "$acode" -ne 0 ]; then
            echo "could not apply all blocking criticals — falling back to issue."; exit 0
          fi
          set +e
          python3 tools/check_patterns.py steamclient.so --json recheck.json > recheck.txt 2>&1
          rc=$?
          set -e
          cat recheck.txt
          if [ "$rc" -ne 0 ]; then
            echo "re-validation not CLEAN (exit $rc) — falling back to issue."; exit 0
          fi
          if git diff --quiet -- src/patterns.hpp; then
            echo "no change produced — falling back to issue."; exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "Critical hooks re-derived and re-validated CLEAN."

      - name: Open critical re-derive PR
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '3' && steps.derive3.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          VER: ${{ steps.ver.outputs.version }}
          ONLY: ${{ steps.derive3.outputs.only }}
        run: |
          SHORT=${SHA:0:8}
          BR="watch-steam/criticals-$SHORT"
          if [ "$(gh pr list --head "$BR" --state all --json number --jq 'length')" != "0" ]; then
            echo "A criticals PR for $SHORT already exists — skipping."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          # A moved CRITICAL hook needs a NEW pattern-set -> a new SafeMode group.
          # Bump res/version.txt to a fresh group-id, create that group in
          # res/updates.yaml, and whitelist this build's hash THERE. Safe to land
          # ahead of the release because deployed .so's key on their OLD compiled
          # group (src/update.cpp) and never see this hash (SafeMode keeps blocking,
          # correct), and LumaDeck's gate reads the RELEASE's version.txt so it will
          # not offer this build until the release compiled from these patterns ships.
          NEW_GROUP=$(date -u +%Y%m%d%H%M%S)
          echo "$NEW_GROUP" > res/version.txt
          CAPS=$(python3 -c "import json;print(json.load(open('recheck.json')).get('caps_str',''))" 2>/dev/null || true)
          python3 tools/whitelist_hash.py "$SHA" --create-group \
            --steam-version "$VER" --caps "$CAPS" \
            --note "critical patterns re-derived by watch-steam.yml $(date -u +%Y-%m-%d); takes effect in the release built from this PR"
          git add src/patterns.hpp res/version.txt res/updates.yaml
          git commit -m "fix(patterns): re-derive critical hooks + new SafeMode group $NEW_GROUP for client $SHORT"
          git push -u origin "$BR"
          {
            echo "Automated by \`watch-steam.yml\`. Steam client \`$VER\` (\`$SHORT\`) moved a"
            echo "**CRITICAL** hook (\`$ONLY\`), so the monitor ran the Ghidra headless derivation"
            echo "(\`derive_patterns.py\`), re-derived UNIQUE pattern(s), applied them to"
            echo "\`src/patterns.hpp\`, and \`check_patterns.py\` now reports **CLEAN**."
            echo
            echo "This PR carries the full bookkeeping: new patterns **and** a bumped"
            echo "\`res/version.txt\` (new SafeMode group \`$NEW_GROUP\`) with this build whitelisted"
            echo "under it. It still **needs a rebuild + release** — the new pattern-set only"
            echo "takes effect in a \`.so\` compiled from this \`version.txt\`; merging alone does"
            echo "not fix Decks."
            echo
            echo "**Safe to merge ahead of the release:** deployed \`.so\`s key on their own"
            echo "compiled group, so they never see this hash (SafeMode keeps blocking, correct),"
            echo "and LumaDeck reads the *release's* \`version.txt\`, so it won't offer this build"
            echo "until the matching release ships."
            echo
            echo "- Steam client version: \`$VER\`"
            echo "- steamclient.so SHA-256: \`$SHA\`"
            echo "- New SafeMode group: \`$NEW_GROUP\`"
            echo
            echo "**Do:** live-install test on a Deck → merge → tag a release (bakes the new"
            echo "\`version.txt\` into the \`.so\` and publishes it as a release asset)."
            echo
            echo '<details><summary>re-validation (check_patterns.py after applying)</summary>'
            echo
            echo '```'
            cat recheck.txt
            echo '```'
            echo '</details>'
          } > pr_body_crit.md
          gh pr create --base main --head "$BR" \
            --title "fix(patterns): re-derived criticals + new group $NEW_GROUP for client $SHORT (auto, needs release)" \
            --body-file pr_body_crit.md

      # ── blocking (3) and auto-derive couldn't fix it: issue ──────────────
      - name: Open blocking issue
        if: steps.check.outcome == 'success' && steps.check.outputs.exit == '3' && steps.derive3.outputs.applied != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          SHORT=${SHA:0:8}
          TITLE="Steam update broke lumalinux patterns (client $SHORT)"
          if [ "$(gh issue list --state all --search "$TITLE in:title" --json number --jq 'length')" != "0" ]; then
            echo "Issue already exists — skipping."; exit 0
          fi
          BLOCKING=$(python3 -c "import json;print(', '.join(json.load(open('result.json'))['blocking']))")
          {
            echo "\`watch-steam.yml\` detected a new Steam client whose \`steamclient.so\` **breaks"
            echo "lumalinux hooks** — NOT whitelisted (SafeMode keeps blocking, correctly)."
            echo
            echo "- Steam client version: \`$VER\`"
            echo "- steamclient.so SHA-256: \`$SHA\`"
            echo "- Blocking: \`$BLOCKING\`"
            echo
            echo "**Auto-derivation was attempted and could not produce a clean fix** — either a"
            echo "finder anchor moved (a code fix in \`package_zero_finder.cpp\`, not a pattern),"
            echo "the Ghidra derivation/apply failed, or re-validation didn't come back CLEAN."
            echo
            echo "This needs a re-derivation (A.2: a critical pattern moved) or a finder code"
            echo "fix (C: a package-0 anchor moved). See \`docs/maintenance.md\` §A.2/§A.3/§C."
            echo "Run \`derive_patterns.py\` in Ghidra against this build to re-derive, then"
            echo "rebuild + release."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > issue_body.md
          gh issue create --title "$TITLE" --body-file issue_body.md

      # ── remember this version so tomorrow's run skips it — ONLY once it is
      # genuinely resolved (its hash is whitelisted in res/updates.yaml on main).
      # A version that came back BROKEN (issue opened) or CLEAN-but-PR-not-yet-
      # merged is deliberately NOT cached, so the daily run keeps re-checking it
      # until the hash actually lands in updates.yaml. Without this, a version
      # processed in a not-yet-fixed state would be marked "done" and never
      # re-validated — even after the fix ships. The dup-PR/issue guards above
      # already prevent spam from the repeated re-checks.
      - name: Mark version processed
        if: steps.seen.outputs.cache-hit != 'true' && success() && (steps.wl.outputs.whitelisted == 'true' || steps.pr.outputs.merged == 'true')
        uses: actions/cache/save@v4
        with:
          path: .watch-steam-seen
          key: steam-client-v2-${{ steps.ver.outputs.version }}
