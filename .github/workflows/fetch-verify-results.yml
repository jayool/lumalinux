name: Fetch Verify Results

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verify-results artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 27462935617 \
            --name verify-results \
            --repo jayool/lumalinux \
            -D out
          cat out/results.txt
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv out/results.txt verify_results.txt
          gh release upload test-deps-v1 verify_results.txt --repo jayool/lumalinux --clobber
