name: watch-steam-x64

# Daily watcher for the 64-bit (steamrt64) Steam client — the x86-64 twin of
# watch-steam.yml. Where the 32-bit watcher checks byte patterns and whitelists
# a hash, the 64-bit runtime resolves ONLY through the RVA feed
# (res/rvas/<sha256>.yaml, docs/steam-rt3-x64.md §1.3): a client build without
# a published feed installs nothing. Until now that feed was derived by
# fetch-steamclient.yml (manual) and copied into main by a person; this job
# closes that gap for the two Steam Deck steamrt64 channels.
#
# Per manifest (stable + publicbeta), per day:
#   1. version gate (cached): nothing to do on a version already processed;
#   2. download steamclient.so; if res/rvas/<sha256>.yaml already exists on
#      main, the build is published — done;
#   3. otherwise derive the feed with tools/check_patterns_x64.py and run the
#      offline C++ rescue self-test (tools/x64_rescues_selftest.cpp) on the
#      same binary, exactly as fetch-steamclient.yml does;
#   4. CLEAN (exit 0) + self-test PASS -> commit the feed through an
#      auto-merged PR (DATA only: the deployed .so fetches the feed by client
#      hash on its next start; build.yml ignores res/rvas/**);
#      non-critical missing (exit 2) + PASS -> publish the same way AND open an
#      issue for the missing hook; BLOCKING (exit 3) or self-test FAIL -> no
#      publish, throwaway branch with the binary + report, issue for a human.
#
# Outcomes mirror watch-steam.yml: A.1-style "publish the data" is automatic,
# anything that needs a decision becomes an issue.

on:
  schedule:
    - cron: '41 7 * * *'      # daily 07:41 UTC, after watch-steam.yml (07:17)
  workflow_dispatch:
    inputs:
      publish:
        description: "Merge a CLEAN feed into main (false = derive, report, push the throwaway branch only)"
        type: boolean
        default: true

permissions:
  contents: write             # push the feed branch / throwaway branch
  pull-requests: write        # open + merge the auto PR
  issues: write               # open the "needs a human" issue

concurrency:
  group: watch-steam-x64
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1         # two manifests may carry the same build; serialise the publish
      matrix:
        manifest:
          - steam_client_steamdeck_stable_steamrt64
          - steam_client_steamdeck_publicbeta_steamrt64
    env:
      LUMA_STEAM_MANIFEST: ${{ matrix.manifest }}
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main           # the feed is published on main; derive against what main has

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ── Level 1: cheap version gate ──────────────────────────────────────
      - name: Current client version (${{ matrix.manifest }})
        id: ver
        run: |
          V=$(python3 tools/fetch_steamclient.py --version-only)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > .watch-steam-x64-seen
          echo "$LUMA_STEAM_MANIFEST version: $V"

      - name: Already processed this version?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .watch-steam-x64-seen
          key: steam-client-x64-v1-${{ matrix.manifest }}-${{ steps.ver.outputs.version }}

      # ── Level 2: only on a NEW version ───────────────────────────────────
      - name: Download steamclient.so
        id: dl
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          OUT=$(python3 tools/fetch_steamclient.py --output steamclient.so)
          SHA=${OUT#sha256=}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          CLASS=$(file -b steamclient.so | cut -d, -f1)
          echo "elf=$CLASS" >> "$GITHUB_OUTPUT"
          echo "steamclient.so: $CLASS, sha256 $SHA"
          if [ -f "res/rvas/$SHA.yaml" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "res/rvas/$SHA.yaml already on main: nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Not a 64-bit client?
        if: steps.seen.outputs.cache-hit != 'true' && !contains(steps.dl.outputs.elf, '64-bit')
        run: |
          echo "::error::$LUMA_STEAM_MANIFEST delivered '${{ steps.dl.outputs.elf }}', not a steamrt64 client"
          exit 1

      # ── Level 3: derive + validate (fetch-steamclient.yml's steps) ───────
      - name: Derive and validate the x86-64 feed
        id: x64
        if: steps.seen.outputs.cache-hit != 'true' && steps.dl.outputs.published != 'true'
        shell: bash
        run: |
          pip install -q capstone
          set +e
          python3 tools/check_patterns_x64.py steamclient.so --json x64-result.json \
            --emit-rvas rvas-out --steam-version "${{ steps.ver.outputs.version }}" | tee x64-report.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "check_patterns_x64.py exit: $code (0 clean / 2 non-critical missing / 3 blocking)"
          selftest=SKIPPED
          if [ "$code" != "3" ]; then
            EXP=$(python3 -c "
          import json; r=json.load(open('x64-result.json'))
          print(' '.join('%s=%s' % (k, v['rva']) for k, v in r['hooks'].items() if v.get('status') == 'UNIQUE' and v.get('rva')))")
            g++ -O2 -std=c++17 tools/x64_rescues_selftest.cpp -o x64_rescues_selftest
            set +e
            ./x64_rescues_selftest steamclient.so $EXP | tee -a x64-report.txt
            set -e
            selftest=$(tail -1 x64-report.txt | grep -Eo '^(PASS|FAIL)' || echo FAIL)
          fi
          echo "selftest=$selftest" >> "$GITHUB_OUTPUT"
          echo "self-test: $selftest"
          if { [ "$code" = "0" ] || [ "$code" = "2" ]; } && [ "$selftest" = "PASS" ] && ls rvas-out/*.yaml >/dev/null 2>&1; then
            echo "verdict=publish" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=human" >> "$GITHUB_OUTPUT"
          fi

      # ── publish: the feed rides an auto-merged DATA-only PR ──────────────
      - name: Publish the feed (auto-merged PR)
        id: pub
        if: steps.x64.outputs.verdict == 'publish' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dl.outputs.sha }}
          SHORT: ${{ steps.dl.outputs.short }}
          VER: ${{ steps.ver.outputs.version }}
          EXIT: ${{ steps.x64.outputs.exit }}
        run: |
          BR="watch-steam-x64/$SHORT"
          mkdir -p res/rvas && cp rvas-out/*.yaml res/rvas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add res/rvas
          git commit -m "chore(rvas): publish x86-64 feed for steamclient $SHORT ($LUMA_STEAM_MANIFEST $VER; CI: derived, self-test PASS)"
          git push -u origin "$BR"
          {
            echo "Automated by \`watch-steam-x64.yml\`. A new 64-bit Steam client shipped on"
            echo "\`$LUMA_STEAM_MANIFEST\` and \`tools/check_patterns_x64.py\` derived its RVA feed"
            echo "(exit $EXIT) with \`tools/x64_rescues_selftest.cpp\` landing on the same addresses."
            echo "DATA only: the deployed 64-bit \`.so\` fetches \`res/rvas/<sha>.yaml\` by client hash"
            echo "on its next start. **Auto-merged**; a live test on a Deck is still worth doing."
            echo
            echo "- Steam client version: \`$VER\`"
            echo "- steamclient.so SHA-256: \`$SHA\`"
            [ "$EXIT" = "2" ] && echo "- ⚠️ a non-critical hook is missing (installs still work); an issue tracks it."
            echo
            echo '<details><summary>check_patterns_x64.py + self-test report</summary>'
            echo; echo '```'; cat x64-report.txt; echo '```'; echo '</details>'
          } > pr_body.md
          gh pr create --base main --head "$BR" \
            --title "rvas: publish x86-64 feed for steamclient $SHORT (auto, $LUMA_STEAM_MANIFEST)" \
            --body-file pr_body.md
          # Same reasoning as watch-steam.yml: a CLEAN feed is a review-free data change,
          # main is unprotected; squash-merge, then drop only the remote branch.
          gh pr merge "$BR" --squash
          git push origin --delete "$BR" || true
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # ── anything else: park the data where a person can look at it ───────
      - name: Push the throwaway branch (needs a human, or publish disabled)
        if: steps.x64.outputs.verdict == 'human' || (steps.x64.outputs.verdict == 'publish' && env.PUBLISH != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          BR="steamclient/${LUMA_STEAM_MANIFEST}-${VER}"
          rm -rf bin-branch && mkdir bin-branch
          cp steamclient.so bin-branch/
          { echo "manifest=$LUMA_STEAM_MANIFEST"; echo "version=$VER"; echo "sha256=${{ steps.dl.outputs.sha }}";
            echo "fetched=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "source=watch-steam-x64.yml"; } > bin-branch/INFO.txt
          cp x64-report.txt bin-branch/ 2>/dev/null || true
          cp x64-result.json bin-branch/ 2>/dev/null || true
          if ls rvas-out/*.yaml >/dev/null 2>&1; then mkdir -p bin-branch/res/rvas && cp rvas-out/*.yaml bin-branch/res/rvas/; fi
          cd bin-branch
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "steamclient.so ${LUMA_STEAM_MANIFEST} ${VER} — throwaway branch, delete when done"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BR}"
          echo "pushed ${BR}"

      - name: Open an issue (needs a human)
        if: steps.x64.outputs.verdict == 'human' || steps.x64.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.dl.outputs.short }}
          VER: ${{ steps.ver.outputs.version }}
          EXIT: ${{ steps.x64.outputs.exit }}
          SELFTEST: ${{ steps.x64.outputs.selftest }}
          VERDICT: ${{ steps.x64.outputs.verdict }}
        run: |
          TITLE="x86-64 feed for steamclient $SHORT needs a look ($LUMA_STEAM_MANIFEST $VER)"
          if [ "$(gh issue list --state all --search "steamclient $SHORT needs a look in:title" --json number --jq 'length')" != "0" ]; then
            echo "issue already exists"; exit 0
          fi
          {
            echo "Automated by \`watch-steam-x64.yml\`."
            echo
            echo "- manifest: \`$LUMA_STEAM_MANIFEST\`, version \`$VER\`, steamclient.so \`${{ steps.dl.outputs.sha }}\`"
            echo "- check_patterns_x64.py exit: \`$EXIT\` (0 clean / 2 non-critical missing / 3 blocking), self-test: \`$SELFTEST\`"
            if [ "$VERDICT" = "publish" ]; then
              echo "- the feed WAS published (non-critical hook missing); this issue tracks re-deriving it."
            else
              echo "- NOT published: deployed 64-bit builds install nothing on this client until a feed exists."
              echo "- binary + report on branch \`steamclient/${LUMA_STEAM_MANIFEST}-${VER}\` (delete when done)."
            fi
            echo
            echo '```'; cat x64-report.txt 2>/dev/null || echo "(no report)"; echo '```'
          } > issue_body.md
          gh issue create --title "$TITLE" --body-file issue_body.md

      # ── remember this version once it has been handled ───────────────────
      - name: Mark version as processed
        if: steps.seen.outputs.cache-hit != 'true' && (steps.dl.outputs.published == 'true' || steps.pub.outputs.merged == 'true' || steps.x64.outputs.verdict == 'human')
        uses: actions/cache/save@v4
        with:
          path: .watch-steam-x64-seen
          key: steam-client-x64-v1-${{ matrix.manifest }}-${{ steps.ver.outputs.version }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## watch-steam-x64: \`$LUMA_STEAM_MANIFEST\` ${{ steps.ver.outputs.version }}"
            echo
            if [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then echo "Version already processed."; exit 0; fi
            echo "- steamclient.so: \`${{ steps.dl.outputs.sha }}\` (${{ steps.dl.outputs.elf }})"
            echo "- already published: ${{ steps.dl.outputs.published }}"
            echo "- derive exit: ${{ steps.x64.outputs.exit }}, self-test: ${{ steps.x64.outputs.selftest }}, verdict: ${{ steps.x64.outputs.verdict }}, merged: ${{ steps.pub.outputs.merged }}"
            if [ -f x64-report.txt ]; then echo; echo '```'; cat x64-report.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
