name: Build

on:
  push:
    branches: [main, master, claude/steam-update-gating]   # TEMP (test build): build the v0.18.0-test.3 prerelease from this branch — do NOT merge this trigger to main
    tags: ['v*']
    # res/updates.yaml is fetched at runtime by the deployed .so (src/update.cpp),
    # not embedded, so a hash-only bump (watch-steam) doesn't change the artifact —
    # skip the rebuild. NOTE: applies to tag pushes too, but a v* release is never
    # cut on an updates.yaml-only commit ("no rebuild, no release"), so it's safe.
    paths-ignore:
      - 'res/updates.yaml'
  pull_request:
    # Same reasoning: skip Build on PRs that only touch res/updates.yaml (the
    # watch-steam hash bumps). Pattern re-derive PRs touch src/patterns.hpp, so
    # they still build. paths-ignore only skips when EVERY changed file matches.
    paths-ignore:
      - 'res/updates.yaml'
  workflow_dispatch:

permissions:
  contents: write  # needed by the release step on tag pushes

jobs:
  build-linux-i386:
    name: Build 32-bit Linux .so
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain and deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            cmake \
            ninja-build

      - name: Fetch libmem (pinned release tarball)
        run: ./tools/fetch_libmem.sh

      - name: Configure
        run: |
          mkdir -p build
          cd build
          # On a v* tag build, pin the binary's version to the tag so its
          # self-reported version (status.json) matches the release tag — else
          # LumaDeck nags "update available" forever (see CMakeLists.txt).
          VERSION_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_ARG="-DLUMALINUX_VERSION_OVERRIDE=${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF_NAME}" == "claude/steam-update-gating" ]]; then
            # TEMP (test build): pin the binary to the prerelease version so
            # status.json self-reports 0.18.0-test.3.
            VERSION_ARG="-DLUMALINUX_VERSION_OVERRIDE=0.18.0-test.3"
          fi
          # -DLUMA_NO_UPDATE=OFF: ship releases WITH the SafeMode hash gate.
          # Safe to enable since 0.15.0 (no libcurl/libcrypto link — sha256 is
          # self-contained and curl is dlopen'd at runtime).
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUMA_NO_UPDATE=OFF \
            $VERSION_ARG

      - name: Build
        run: |
          cd build
          ninja -v

      - name: Verify output
        run: |
          file build/liblumalinux.so
          # `file` >= 5.45 reports "Intel i386"; older versions report "Intel
          # 80386". Accept both — install.sh does the same.
          file build/liblumalinux.so | grep -qE "ELF 32-bit.*Intel (80386|i386)" || {
              echo "ERROR: output is not 32-bit ELF"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lumalinux
          path: |
            build/liblumalinux.so
            install.sh
            example/keys.txt
            README.md
            tools/steamidra_lite.py
            tools/derive_patterns.py
            tools/vdf_inject_keys.py
            tools/ghidra_find_gmrc.py

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'claude/steam-update-gating'
        uses: softprops/action-gh-release@v2
        with:
          # Tag push: normal (named after the tag). Test-branch push: publish the
          # fixed v0.18.0-test.3 PRERELEASE.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.18.0-test.3' }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          target_commitish: ${{ github.sha }}
          # Ship res/version.txt alongside the .so: it is the SafeMode group-id
          # (pattern-set version) compiled INTO this binary. LumaDeck reads it from
          # the release (releases/latest/download/version.txt) to answer "which
          # SafeModeHashes group does the shipping binary actually hook?" — so its
          # update gate follows the released binary, not whatever newer group main
          # may already carry ahead of a release. Without this the gate would offer
          # a build the downloaded .so can't hook yet.
          files: |
            build/liblumalinux.so
            res/version.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
