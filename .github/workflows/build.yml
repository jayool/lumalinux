name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed by the release step on tag pushes

jobs:
  build-linux-i386:
    name: Build 32-bit Linux .so
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain and deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            cmake \
            ninja-build \
            pkg-config \
            libcurl4-openssl-dev:i386 \
            libssl-dev:i386

      - name: Fetch libmem (pinned release tarball)
        run: ./tools/fetch_libmem.sh

      - name: Configure
        run: |
          mkdir -p build
          cd build
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig \
            cmake .. \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          ninja -v

      - name: Verify output
        run: |
          file build/liblumalinux.so
          # `file` >= 5.45 reports "Intel i386"; older versions report "Intel
          # 80386". Accept both — install.sh does the same.
          file build/liblumalinux.so | grep -qE "ELF 32-bit.*Intel (80386|i386)" || {
              echo "ERROR: output is not 32-bit ELF"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lumalinux
          path: |
            build/liblumalinux.so
            install.sh
            example/keys.txt
            README.md
            tools/steamidra_lite.py
            tools/derive_patterns.py
            tools/vdf_inject_keys.py
            tools/ghidra_find_gmrc.py

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/liblumalinux.so
          generate_release_notes: true
          fail_on_unmatched_files: true
