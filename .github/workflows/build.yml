name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-i386:
    name: Build 32-bit Linux .so
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain and deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            cmake \
            ninja-build

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          # libmem uses ExternalProject_Add internally for capstone, which doesn't
          # interact cleanly with ninja's dependency graph: ninja tries to link
          # liblumalinux.so before capstone has been built, causing a missing
          # libcapstone.a error. Workaround: two-pass build. First pass builds
          # capstone (link will fail). Second pass succeeds because the .a now exists.
          ninja -v || true
          ninja -v

      - name: Verify output
        run: |
          file build/liblumalinux.so
          # Should report "ELF 32-bit LSB shared object, Intel 80386"
          file build/liblumalinux.so | grep -q "ELF 32-bit.*Intel 80386" || {
              echo "ERROR: output is not 32-bit ELF"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lumalinux
          path: |
            build/liblumalinux.so
            install.sh
            example/keys.txt
            README.md
