name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # res/updates.yaml and res/rvas/ are fetched at runtime by the deployed .so
    # (src/update.cpp, src/rva_feed.cpp), not embedded, so a data-only bump
    # (watch-steam) doesn't change the artifact — skip the rebuild. NOTE: applies
    # to tag pushes too, but a v* release is never cut on a data-only commit
    # ("no rebuild, no release"), so it's safe.
    paths-ignore:
      - 'res/updates.yaml'
      - 'res/rvas/**'
  pull_request:
    # Same reasoning: skip Build on PRs that only touch runtime-fetched data (the
    # watch-steam hash bumps, which since 2026-08-11 carry res/rvas too). Pattern
    # re-derive PRs touch src/patterns.hpp, so they still build — paths-ignore only
    # skips when EVERY changed file matches, and that is what keeps the re-derive
    # paths building even though they now commit res/rvas as well.
    paths-ignore:
      - 'res/updates.yaml'
      - 'res/rvas/**'
  workflow_dispatch:

permissions:
  contents: write  # needed by the release step on tag pushes

jobs:
  build-linux-i386:
    name: Build 32-bit Linux .so
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain and deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            cmake \
            ninja-build

      # Nothing ran tools/test_*.py until 2026-09-08: three unit tests existed
      # and no workflow invoked them, so they could rot silently. They are cheap
      # (synthetic inputs, no steamclient.so, no network) and they pin things a
      # compile cannot — above all that the four implementations of the
      # cache-access idiom still agree, which is exactly what had drifted.
      - name: Unit tests (synthetic inputs, no steamclient.so needed)
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

      - name: Fetch libmem (pinned release tarball)
        run: ./tools/fetch_libmem.sh

      - name: Configure
        run: |
          mkdir -p build
          cd build
          # On a v* tag build, pin the binary's version to the tag so its
          # self-reported version (status.json) matches the release tag — else
          # LumaDeck nags "update available" forever (see CMakeLists.txt).
          VERSION_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_ARG="-DLUMALINUX_VERSION_OVERRIDE=${GITHUB_REF#refs/tags/v}"
          fi
          # -DLUMA_NO_UPDATE=OFF: ship releases WITH the SafeMode hash gate.
          # Safe to enable since 0.15.0 (no libcurl/libcrypto link — sha256 is
          # self-contained and curl is dlopen'd at runtime).
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUMA_NO_UPDATE=OFF \
            $VERSION_ARG

      - name: Build
        run: |
          cd build
          ninja -v

      - name: Verify output
        run: |
          file build/liblumalinux.so
          # `file` >= 5.45 reports "Intel i386"; older versions report "Intel
          # 80386". Accept both — install.sh does the same.
          file build/liblumalinux.so | grep -qE "ELF 32-bit.*Intel (80386|i386)" || {
              echo "ERROR: output is not 32-bit ELF"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lumalinux
          path: |
            build/liblumalinux.so
            install.sh
            example/keys.txt
            README.md
            tools/steamidra_lite.py
            tools/derive_patterns.py
            tools/vdf_inject_keys.py
            tools/ghidra_find_gmrc.py

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Ship res/version.txt alongside the .so: it is the SafeMode group-id
          # (pattern-set version) compiled INTO this binary. LumaDeck reads it from
          # the release (releases/latest/download/version.txt) to answer "which
          # SafeModeHashes group does the shipping binary actually hook?" — so its
          # update gate follows the released binary, not whatever newer group main
          # may already carry ahead of a release. Without this the gate would offer
          # a build the downloaded .so can't hook yet.
          files: |
            build/liblumalinux.so
            res/version.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The 64-bit library for Valve's steamrt3 client (steamrt64/steam, Steam Deck
  # beta channel since 2026-10). Built INSIDE the Steam Runtime 3 "sniper" SDK
  # so the glibc symbols it needs are the container's (2.31): a .so built on
  # the ubuntu-latest runner would ask for a newer glibc and never load there.
  # It resolves its hooks through the RVA feed (res/rvas/<sha>.yaml, published
  # by watch-steam.yml) and ships in every v* release next to the 32-bit .so as
  # liblumalinux-x86_64.so: setup.sh installs both and the launcher names both
  # in LD_PRELOAD, each client loads its own (docs/steam-rt3-x64.md §3 point 4).
  # Runs after the i386 job so the release exists before this asset is attached.
  build-linux-x86_64:
    name: Build 64-bit Linux .so (steamrt3 sniper SDK)
    needs: build-linux-i386
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain from the runtime SDK
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build git curl ca-certificates file binutils

      - name: Fetch libmem (x86_64)
        run: LUMA_ARCH=x86_64 ./tools/fetch_libmem.sh

      - name: Build yaml-cpp (x86_64, static, PIC)
        run: ./tools/build_yamlcpp.sh

      - name: Configure
        shell: bash
        run: |
          mkdir -p build64 && cd build64
          VERSION_ARG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_ARG="-DLUMALINUX_VERSION_OVERRIDE=${GITHUB_REF#refs/tags/v}"
          fi
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMA_NO_UPDATE=OFF -DLUMA_X86_64=ON $VERSION_ARG

      - name: Build
        run: cd build64 && ninja -v

      # Proof that the x86-64 trampoline fix-up works against THIS libmem and
      # this toolchain (src/rip_fixup_core.hpp): libmem copies a rip-relative
      # prologue verbatim; the hook on the 64-bit client's GetShaderCacheDepot
      # depends on the rebase, and on the refusal when it cannot rebase.
      - name: Trampoline fix-up self-test
        run: |
          g++ -O1 -std=c++20 -masm=intel -I src -I lib/x86_64/include \
            tools/rip_fixup_selftest.cpp src/compat_x86_64.cpp lib/x86_64/liblibmem.a -lpthread -o build64/rip_fixup_selftest
          build64/rip_fixup_selftest
          # Compile-only here (no steamclient.so on the runner); fetch-steamclient.yml
          # runs it against every steamrt64 client it downloads.
          g++ -O2 -std=c++17 tools/x64_rescues_selftest.cpp -o build64/x64_rescues_selftest

      - name: Verify output
        shell: bash
        run: |
          file build64/liblumalinux.so
          file build64/liblumalinux.so | grep -q "ELF 64-bit" || { echo "ERROR: not a 64-bit ELF"; exit 1; }
          # The container's glibc is 2.31: anything newer would not load there.
          max="$(objdump -T build64/liblumalinux.so | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"
          echo "newest glibc symbol version: ${max}"
          [[ "$(printf '%s\n' "${max#GLIBC_}" 2.31 | sort -V | tail -1)" == "2.31" ]] || { echo "ERROR: ${max} is newer than the runtime's 2.31"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lumalinux-x86_64
          path: build64/liblumalinux.so

      - name: Attach to the release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build64/liblumalinux.so liblumalinux-x86_64.so

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: liblumalinux-x86_64.so
          fail_on_unmatched_files: true

