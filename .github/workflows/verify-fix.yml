name: Runtime smoke test (loads lumalinux, checks hooks)

# Manual runtime smoke test: build a fresh liblumalinux.so, load it into a real
# Steam process against the CURRENT steamclient.so + CURRENT SLSsteam/CloudRedirect,
# and assert it LOADS, INSTALLS ITS HOOKS, and doesn't crash.
#
# This is the ONLY test that actually RUNS the .so. build.yml only compiles, and
# check_patterns.py only resolves statically — so a change that compiles and
# resolves on paper but crashes or fails to hook at runtime (e.g. a bad memory
# read in a new resolver — the DepotKey derive-by-signature risk in v0.16.18) is
# invisible to them. This starts the engine.
#
# Self-contained: it fetches EVERYTHING current at run time — the steamclient.so
# (fetch_steamclient.py), SLSsteam + library-inject (AceSLS latest), and
# CloudRedirect (linux-test) — and builds the fix_atexit shim inline. The only
# thing it pulls from the test-deps-v1 release is the heavy real-Steam bootstrap
# tree (steam_ubuntu12_32.tar.gz, a manual 329 MB asset). Replaces both the old
# atexit-crash harness AND its build-testing-harness generator (whose sos/libs
# artifacts went stale and were mostly unused).
#
# Manual only — heavy. Run before a release, or after touching hooking code
# (rtti.cpp, hooks/, lmhook.cpp, main.cpp, patterns). Checks out the dispatched
# ref, so you can validate a branch/tag BEFORE merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # dispatched ref (branch/tag/PR head) — validate BEFORE merge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake ninja-build pkg-config \
            libcurl4-openssl-dev:i386 libssl-dev:i386 p7zip-full wget

      - name: Fetch libmem
        run: ./tools/fetch_libmem.sh

      - name: Build liblumalinux.so (SafeMode gate OFF)
        # Default LUMA_NO_UPDATE (ON here) compiles OUT the hash gate, so the hooks
        # install regardless of whether this steamclient's hash is whitelisted — we
        # want to exercise the HOOK-INSTALL code, not the whitelist.
        run: |
          mkdir -p build && cd build
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -v
          file liblumalinux.so

      - name: Fetch the CURRENT steamclient.so
        run: |
          python3 tools/fetch_steamclient.py --output current-steamclient.so
          echo "current steamclient.so:"; sha256sum current-steamclient.so

      - name: Fetch CURRENT SLSsteam + CloudRedirect, build fix_atexit shim
        run: |
          mkdir -p sos && cd sos
          # SLSsteam (latest release): SLSsteam.so + library-inject.so
          TAG=$(curl -sSL -o /dev/null -w "%{url_effective}" "https://github.com/AceSLS/SLSsteam/releases/latest")
          TAG="${TAG##*/}"; echo "SLSsteam latest: $TAG"
          wget -q "https://github.com/AceSLS/SLSsteam/releases/download/$TAG/SLSsteam-Any.7z" -O SLSsteam.7z
          7z x -y SLSsteam.7z >/dev/null
          cp bin/SLSsteam.so SLSsteam.so
          cp bin/library-inject.so library-inject.so
          # CloudRedirect (linux-test channel)
          wget -q https://github.com/Selectively11/h3adcr-b/releases/download/linux-test/cloud_redirect.so -O cloud_redirect.so
          # fix_atexit shim (forces a clean _exit at shutdown; harmless if unneeded)
          cat > fix_atexit.c <<'EOF'
          #include <stdlib.h>
          #include <unistd.h>
          static void e(void){_exit(0);}
          __attribute__((constructor)) static void r(void){atexit(e);}
          EOF
          gcc -m32 -shared -fPIC -o fix_atexit.so fix_atexit.c
          echo "fetched:"; ls -la SLSsteam.so library-inject.so cloud_redirect.so fix_atexit.so

      - name: Download the real-Steam bootstrap tree (test-deps-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deck-env/steam-tree
          gh release download test-deps-v1 --repo jayool/lumalinux \
            --pattern "steam_ubuntu12_32.tar.gz" --dir deck-env
          tar xzf deck-env/steam_ubuntu12_32.tar.gz -C deck-env/steam-tree

      - name: Swap in the current steamclient.so
        # Replace the frozen bootstrap's steamclient.so with the CURRENT one so
        # lumalinux hooks TODAY's build. Valve keeps the bootstrap<->steamclient
        # interface versioned, so an older bootstrap still maps a newer steamclient
        # — all lumalinux needs to scan + hook. Overwrite every copy (robust to layout).
        run: |
          n=0
          while IFS= read -r sc; do
            cp -f current-steamclient.so "$sc"; n=$((n+1)); echo "swapped: $sc"
          done < <(find deck-env/steam-tree -name steamclient.so)
          test "$n" -gt 0 || { echo "ERROR: no steamclient.so in the tree to swap"; exit 1; }

      - name: Set up fake HOME
        run: |
          mkdir -p /tmp/fakehome/.local/share/SLSsteam /tmp/fakehome/.local/share/CloudRedirect \
                   /tmp/fakehome/.local/share/lumalinux /tmp/fakehome/.config/SLSsteam \
                   /tmp/fakehome/.cache/lumalinux
          cp sos/SLSsteam.so        /tmp/fakehome/.local/share/SLSsteam/
          cp sos/library-inject.so  /tmp/fakehome/.local/share/SLSsteam/
          cp sos/cloud_redirect.so  /tmp/fakehome/.local/share/CloudRedirect/
          cp build/liblumalinux.so  /tmp/fakehome/.local/share/lumalinux/
          cp sos/fix_atexit.so      /tmp/fakehome/.local/share/lumalinux/
          cat > /tmp/fakehome/.config/SLSsteam/config.yaml <<'EOF'
          PlayNotOwnedGames: no
          SafeMode: no
          DisableCloud: no
          NotifyInit: no
          Notifications: no
          warnHashMissmatch: no
          AdditionalApps: []
          AppIds: []
          EOF
          mkdir -p /tmp/fakehome/.steam /tmp/fakehome/.local/share/Steam
          ln -sf /tmp/fakehome/.local/share/Steam /tmp/fakehome/.steam/steam
          ln -sf "$PWD/deck-env/steam-tree/ubuntu12_32" /tmp/fakehome/.local/share/Steam/ubuntu12_32

      - name: Run the full stack against the current steamclient
        run: |
          cd deck-env/steam-tree/ubuntu12_32
          ulimit -c 0
          LIB_INJECT=/tmp/fakehome/.local/share/SLSsteam/library-inject.so
          SLS=/tmp/fakehome/.local/share/SLSsteam/SLSsteam.so
          CR=/tmp/fakehome/.local/share/CloudRedirect/cloud_redirect.so
          LUMA=/tmp/fakehome/.local/share/lumalinux/liblumalinux.so
          rm -f /tmp/fakehome/.cache/lumalinux/lumalinux.log
          set +e
          crashes=0
          for i in $(seq 1 5); do
            HOME=/tmp/fakehome LD_LIBRARY_PATH="/usr/lib32" \
            LD_AUDIT="$LIB_INJECT:$SLS" LD_PRELOAD="$LUMA:$CR" \
              timeout 25 ./steam -nominidumps -nobreakpad > /dev/null 2>&1
            ex=$?
            echo "run $i exit=$ex"
            [ "$ex" -eq 134 ] && crashes=$((crashes+1))
          done
          set -e
          echo "crashes(SIGABRT)=$crashes"
          echo "crashes=$crashes" >> "$GITHUB_ENV"

      - name: Assert loaded + hooks installed + no crash
        run: |
          LOG=/tmp/fakehome/.cache/lumalinux/lumalinux.log
          echo "── lumalinux log tail ──"
          tail -50 "$LOG" 2>/dev/null || { echo "FAIL: no log — lumalinux never ran / steamclient.so never mapped"; exit 1; }
          echo "────────────────────────"
          grep -aqE 'hooks active' "$LOG" \
            || { echo "FAIL: no 'X/X hooks active' — lumalinux did not install its hooks against the current steamclient"; exit 1; }
          grep -aqE 'name=DepotKey .*outcome=installed' "$LOG" \
            || { echo "FAIL: DepotKey did not install"; exit 1; }
          test "${crashes:-1}" -eq 0 || { echo "FAIL: ${crashes} SIGABRT crash(es)"; exit 1; }
          echo "PASS: lumalinux loaded, DepotKey + hooks installed against the CURRENT steamclient, no crash."

      - name: Upload lumalinux log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-lumalinux-log
          path: /tmp/fakehome/.cache/lumalinux/lumalinux.log
