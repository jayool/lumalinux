name: Runtime smoke test (WIP — has never passed, do not rely on it)

# ============================================================================
# STATUS: WORK IN PROGRESS. THIS WORKFLOW HAS NEVER PRODUCED A GREEN RUN.
# ============================================================================
# Read this before trusting anything below it. As of 2026-09-08 every real
# execution of this file has failed inside the HARNESS — while fetching or
# booting Steam — without reaching a single assertion. It is not a gate, it is
# not evidence, and a red run here says nothing about the code under test.
#
# It is kept, rather than deleted, because the gap it aims at is real and
# nothing else covers it (see "the gap", below). Finish it or delete it; do
# not cite it.
#
# The one thing that DOES validate a change end to end today is the manual
# on-device procedure in docs/update-testing.md, Part 2 — a SteamOS box with a
# logged-in Steam. That is what validated the 2026-09-08 finder rework.
#
# THE GAP IT AIMS AT: nothing in CI ever RUNS the .so. build.yml compiles and
# runs the tools/test_*.py unit tests; check_patterns.py resolves addresses
# statically. So a change that compiles and resolves on paper but crashes or
# fails to hook at runtime (e.g. a bad memory read in a new resolver — the
# DepotKey derive-by-signature risk in v0.16.18) is invisible to both. This
# file is the attempt to start the engine.
#
# WHAT THE REST OF THIS COMMENT DESCRIBES IS THE INTENT, NOT A WORKING
# MECHANISM. The design below is what it is *trying* to do:
#
# Self-contained: it fetches EVERYTHING current at run time — Valve's official
# Steam bootstrapper (repo.steampowered.com), which downloads the Steam Runtime
# and the client itself on first boot; the current steamclient.so
# (fetch_steamclient.py) to report which build we are looking at; SLSsteam +
# library-inject (AceSLS latest); and CloudRedirect (linux-test). Nothing is
# pinned: the 329 MB steam_ubuntu12_32.tar.gz from test-deps-v1 (uploaded
# 2026-06-13, never refreshed) is gone.
#
# It boots Steam through steam.sh with EXACTLY the injection environment
# setup.sh puts on a Deck — LD_AUDIT=library-inject:SLSsteam,
# LD_PRELOAD=lumalinux:cloud_redirect — under xvfb, and every byte of output is
# captured and uploaded.
#
# WHAT IT STILL CANNOT COVER: there is no login, so PackageId 0 never exists
# (Steam only builds it once a session has loaded a licence set) and the finder
# is therefore asserted only as far as resolving its cache address. Injection
# into package 0 remains a real-Deck check.
#
# HISTORY, so nobody re-derives it — and so nobody repeats the mistake that
# made this file look healthy for months:
#
#   - It was born to verify ONE fix (the atexit crash), then was rewritten into
#     a full-stack harness that was NEVER ACTUALLY RUN. The "successful" run
#     people pointed at belonged to a DIFFERENT workflow. A workflow nobody
#     executes reads exactly like a workflow that passes.
#   - Its first real execution, 2026-09-08 run 6, failed: all five Steam
#     attempts timed out, steamclient.so never mapped. Every assertion in it had
#     been decorative.
#   - Runs 7-10 the same day each failed on a different harness fault — missing
#     :i386 libs, a guessed bootstrapper URL, looking for steam.sh in the
#     launcher package instead of inside bootstraplinux_ubuntu12_32.tar.xz. Each
#     was fixed; the next one surfaced. None reached an assertion either.
#
# An earlier version of this comment claimed the file "now loads the client
# library in a purpose-built 32-bit host instead of trying to boot Steam". That
# was false — the steps below boot steam.sh. Corrected here rather than left to
# mislead the next reader.
#
# WHEN IT WORKS, it should be: manual only, heavy. Run before a release, or
# after touching hooking code (rtti.cpp, hooks/, lmhook.cpp, main.cpp,
# patterns). It checks out the dispatched ref, so a branch/tag can be validated
# BEFORE merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # dispatched ref (branch/tag/PR head) — validate BEFORE merge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install 32-bit toolchain and the runtime libs steamclient.so needs
        # steamclient.so has real DT_NEEDED deps on the 32-bit X/desktop stack;
        # without them dlopen fails with "libXrandr.so.2: cannot open shared
        # object file" and nothing downstream runs. RTLD_LAZY does not help —
        # these are load-time dependencies, not lazily-bound symbols.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake ninja-build p7zip-full \
            xvfb wget ca-certificates \
            libc6:i386 libstdc++6:i386 \
            libx11-6:i386 libxext6:i386 libxrandr2:i386 libxfixes3:i386 \
            libxi6:i386 libxcursor1:i386 libxinerama1:i386 libxss1:i386 \
            libgl1:i386 libglx-mesa0:i386 libdbus-1-3:i386 libnss3:i386 \
            libudev1:i386 libpulse0:i386 libsm6:i386 libice6:i386

      - name: Fetch libmem
        run: ./tools/fetch_libmem.sh

      - name: Build liblumalinux.so (SafeMode gate OFF)
        # Default LUMA_NO_UPDATE (ON here) compiles OUT the hash gate, so the hooks
        # install regardless of whether this steamclient's hash is whitelisted — we
        # want to exercise the HOOK-INSTALL code, not the whitelist.
        run: |
          mkdir -p build && cd build
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -v
          file liblumalinux.so

      - name: Fetch the CURRENT steamclient.so
        run: |
          python3 tools/fetch_steamclient.py --output current-steamclient.so
          echo "current steamclient.so:"; sha256sum current-steamclient.so

      - name: Fetch CURRENT SLSsteam + CloudRedirect, build fix_atexit shim
        run: |
          mkdir -p sos && cd sos
          # SLSsteam (latest release): SLSsteam.so + library-inject.so.
          # The asset name changed upstream (SLSsteam-Any.7z -> per-variant
          # SLSsteam-Any-release.7z / -debug.7z, first shipped in 20260819131545),
          # so try the current name and fall back to the legacy one instead of
          # 404ing. Mirrors resolve_slssteam_asset() in setup.sh.
          TAG=$(curl -sSL -o /dev/null -w "%{url_effective}" "https://github.com/AceSLS/SLSsteam/releases/latest")
          TAG="${TAG##*/}"; echo "SLSsteam latest: $TAG"
          for ASSET in SLSsteam-Any-release.7z SLSsteam-Any.7z; do
            URL="https://github.com/AceSLS/SLSsteam/releases/download/$TAG/$ASSET"
            if wget -q "$URL" -O SLSsteam.7z; then echo "SLSsteam asset: $ASSET"; break; fi
            rm -f SLSsteam.7z
          done
          [ -s SLSsteam.7z ] || { echo "::error::No SLSsteam archive found in release $TAG (renamed again?)"; exit 1; }
          7z x -y SLSsteam.7z >/dev/null
          cp bin/SLSsteam.so SLSsteam.so
          cp bin/library-inject.so library-inject.so
          # CloudRedirect (linux-test channel)
          wget -q https://github.com/Selectively11/h3adcr-b/releases/download/linux-test/cloud_redirect.so -O cloud_redirect.so
          # fix_atexit shim (forces a clean _exit at shutdown; harmless if unneeded)
          cat > fix_atexit.c <<'EOF'
          #include <stdlib.h>
          #include <unistd.h>
          static void e(void){_exit(0);}
          __attribute__((constructor)) static void r(void){atexit(e);}
          EOF
          gcc -m32 -shared -fPIC -o fix_atexit.so fix_atexit.c
          echo "fetched:"; ls -la SLSsteam.so library-inject.so cloud_redirect.so fix_atexit.so

      # THE REAL CLIENT, not a tree of files. Valve's bootstrapper is the same
      # thing a desktop install starts from: it brings steam.sh, and on first run
      # it downloads the Steam Runtime and the client itself. Booting through
      # steam.sh is what a Deck does (setup.sh drives /usr/lib/steamos/steam-launcher,
      # which ends up here); running ubuntu12_32/steam directly — what this
      # workflow used to do — skips the runtime setup and never gets far enough
      # to map steamclient.so.
      # MEASURE, DO NOT GUESS. The previous attempt hard-coded one bootstrapper
      # URL, it 404'd, and the step died in two seconds with `wget -q` telling us
      # nothing. Nothing here is fatal until every source has been tried and
      # reported, and the manifest's package list is printed first because that
      # is free and it is the one network path this workflow has ALWAYS been able
      # to reach (fetch_steamclient.py has worked in every run).
      - name: Locate a Steam bootstrapper (report everything, fail last)
        run: |
          set +e
          echo "── client manifest packages (free, no downloads) ──"
          python3 tools/fetch_steamclient.py --list-packages
          echo "── candidate bootstrapper URLs ──"
          FOUND=""
          for U in \
            "https://repo.steampowered.com/steam/archive/precise/steam_latest.tar.gz" \
            "https://repo.steampowered.com/steam/archive/stable/steam_latest.tar.gz" \
            "https://steamcdn-a.akamaihd.net/client/installer/steam.deb" \
            "https://cdn.akamai.steamstatic.com/client/installer/steam.deb" \
            "https://media.steampowered.com/client/installer/steam.deb" ; do
            CODE=$(curl -sS -o cand.bin -L -w "%{http_code}" --max-time 120 "$U")
            SZ=$(stat -c%s cand.bin 2>/dev/null || echo 0)
            echo "  http=$CODE size=$SZ  $U"
            if [ "$CODE" = "200" ] && [ "$SZ" -gt 100000 ]; then
              FOUND="$U"; cp cand.bin bootstrapper.bin; break
            fi
          done
          set -e
          test -n "$FOUND" || { echo "ERROR: no bootstrapper source reachable — see the codes above"; exit 1; }
          echo "using: $FOUND"

          mkdir -p steam-boot
          case "$FOUND" in
            *.tar.gz) tar xzf bootstrapper.bin -C steam-boot ;;
            *.deb)    ( cd steam-boot && ar x ../bootstrapper.bin && tar xf data.tar.* ) ;;
          esac

          # steam.sh is NOT in the launcher package: that package ships
          # bootstraplinux_ubuntu12_32.tar.xz, and the Debian postinst unpacks it
          # into ~/.local/share/Steam — steam.sh comes out of THAT. Run 9 looked
          # for steam.sh in the package itself and found only bin_steam.sh (the
          # /usr/bin/steam wrapper), which is why it bailed with the bootstrap
          # sitting right there unused.
          BOOT=$(find steam-boot -name 'bootstraplinux_ubuntu12_32.tar.xz' | head -1)
          test -n "$BOOT" || { echo "ERROR: no bootstraplinux_ubuntu12_32.tar.xz in the package"; find steam-boot -maxdepth 4 | head -60; exit 1; }
          echo "bootstrap=$BOOT ($(stat -c%s "$BOOT") bytes)"
          mkdir -p /tmp/fakehome/.local/share/Steam
          tar xJf "$BOOT" -C /tmp/fakehome/.local/share/Steam
          echo "── unpacked into the fake HOME's Steam dir ──"
          ls -la /tmp/fakehome/.local/share/Steam | head -20
          SH=/tmp/fakehome/.local/share/Steam/steam.sh
          test -x "$SH" || { echo "ERROR: no executable steam.sh after unpacking the bootstrap"; find /tmp/fakehome/.local/share/Steam -maxdepth 2 | head -40; exit 1; }
          echo "steam.sh=$SH"
          echo "STEAM_DIR=/tmp/fakehome/.local/share/Steam" >> "$GITHUB_ENV"

      - name: Set up fake HOME
        run: |
          mkdir -p /tmp/fakehome/.local/share/SLSsteam /tmp/fakehome/.local/share/CloudRedirect \
                   /tmp/fakehome/.local/share/lumalinux /tmp/fakehome/.config/SLSsteam \
                   /tmp/fakehome/.cache/lumalinux
          cp sos/SLSsteam.so        /tmp/fakehome/.local/share/SLSsteam/
          cp sos/library-inject.so  /tmp/fakehome/.local/share/SLSsteam/
          cp sos/cloud_redirect.so  /tmp/fakehome/.local/share/CloudRedirect/
          cp build/liblumalinux.so  /tmp/fakehome/.local/share/lumalinux/
          cp sos/fix_atexit.so      /tmp/fakehome/.local/share/lumalinux/
          cat > /tmp/fakehome/.config/SLSsteam/config.yaml <<'EOF'
          PlayNotOwnedGames: no
          SafeMode: no
          DisableCloud: no
          NotifyInit: no
          Notifications: no
          warnHashMissmatch: no
          AdditionalApps: []
          AppIds: []
          EOF
          mkdir -p /tmp/fakehome/.steam /tmp/fakehome/.local/share/Steam
          ln -sf /tmp/fakehome/.local/share/Steam /tmp/fakehome/.steam/steam
          echo "Steam dir already holds the unpacked bootstrap:"; ls /tmp/fakehome/.local/share/Steam | head

      # Boot Steam with EXACTLY the environment setup.sh puts on a Deck
      # (luma_set_injection_env): LD_AUDIT=library-inject:SLSsteam and
      # LD_PRELOAD=lumalinux:cloud_redirect, in that order. Under xvfb because
      # the client wants a display. Everything is captured — the run that
      # preceded this one sent Steam's output to /dev/null and left us guessing
      # for an afternoon.
      #
      # First boot is slow: the bootstrapper self-updates and pulls the Steam
      # Runtime (~300 MB) before the client starts, so the old 25 s budget could
      # never have worked. NOT LOGGED IN, and that is a real limit rather than an
      # oversight: PackageId 0 only exists once a session has loaded a licence
      # set, so the finder is asserted as far as resolving its address and no
      # further. Hooks installing against the live client IS covered.
      - name: Boot Steam with the Deck's injection env
        run: |
          LIB_INJECT=/tmp/fakehome/.local/share/SLSsteam/library-inject.so
          SLS=/tmp/fakehome/.local/share/SLSsteam/SLSsteam.so
          CR=/tmp/fakehome/.local/share/CloudRedirect/cloud_redirect.so
          LUMA=/tmp/fakehome/.local/share/lumalinux/liblumalinux.so
          rm -f /tmp/fakehome/.cache/lumalinux/lumalinux.log
          ulimit -c 0
          set +e
          cd "$STEAM_DIR"
          HOME=/tmp/fakehome \
          LD_AUDIT="$LIB_INJECT:$SLS" LD_PRELOAD="$LUMA:$CR" \
            timeout 900 xvfb-run -a ./steam.sh -silent -nominidumps -nobreakpad \
              > "$GITHUB_WORKSPACE/steam-stdout.log" 2>&1
          echo "steam exit=$? (not trustworthy: lumalinux's atexit shim forces _exit(0))"
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "── last 80 lines of Steam's own output ──"
          tail -80 steam-stdout.log || true
          echo "── bootstrapped tree ──"
          ls -la /tmp/fakehome/.local/share/Steam/ubuntu12_32/steamclient.so 2>&1 || \
            echo "(no ubuntu12_32/steamclient.so — the bootstrap did not get that far)"

      - name: Assert loaded + hooks installed + no crash
        run: |
          LOG=/tmp/fakehome/.cache/lumalinux/lumalinux.log
          echo "── lumalinux log tail ──"
          tail -50 "$LOG" 2>/dev/null || { echo "FAIL: no log — lumalinux never ran / steamclient.so never mapped"; exit 1; }
          echo "────────────────────────"
          # Tell a HARNESS failure apart from OURS. Both used to print the same
          # "did not install its hooks", which on 2026-09-08 sent the diagnosis
          # off after a red herring: Steam had never mapped steamclient.so at
          # all, so the hooks were never given anything to install against.
          # No exit-code gates anywhere: lumalinux registers atexit(_exit(0)),
          # so every process it is preloaded into reports 0 regardless.
          grep -aqE 'steamclient.so detected|installing hooks' "$LOG" \
            || { echo "HARNESS FAIL: Steam never mapped steamclient.so in a process lumalinux is in — see steam-stdout.log; the client did not boot far enough, this is not the hooks"; exit 1; }
          grep -aqE 'hooks active' "$LOG" \
            || { echo "FAIL: steamclient.so WAS mapped and lumalinux saw it, but no 'X/X hooks active' — this one is ours"; exit 1; }
          grep -aqE 'name=DepotKey .*outcome=installed' "$LOG" \
            || { echo "FAIL: DepotKey did not install"; exit 1; }
          # The package-0 finder is the SOLE depot injector, and until now this
          # smoke test — the only thing that actually runs the .so — said nothing
          # about it. Everything it does is exactly what this workflow exists to
          # catch: it derives addresses at runtime and then READS AND WRITES
          # through them, which is precisely the "bad memory read in a new
          # resolver" case named at the top of this file.
          #
          # Package 0 itself cannot be found here (that needs a logged-in Steam
          # with a licence set), so the assertion stops at the resolution step:
          # the finder must reach a cache address. That is the one line that
          # survives whichever resolver wins — method=rva when the feed carries
          # this build's disp, method=scan when it does not — so it does not have
          # to be rewritten every time the resolver chain changes.
          echo "── package-0 finder ──"
          grep -aE 'PKG0_FINDER|Finder resolve:' "$LOG" || echo "(no finder lines at all)"
          echo "──────────────────────"
          grep -aqE 'Finder resolve: name=PKG0Finder .*outcome=resolved' "$LOG" \
            || { echo "FAIL: the package-0 finder resolved no cache address — see the finder lines above for which anchor failed (GOT or the cache-access idiom) and whether it was NOT_FOUND or AMBIGUOUS"; exit 1; }
          test "${crashes:-1}" -eq 0 || { echo "FAIL: ${crashes} SIGABRT crash(es)"; exit 1; }
          echo "PASS: lumalinux loaded, DepotKey + hooks installed, package-0 finder resolved its cache address against the CURRENT steamclient, no crash."

      - name: Upload lumalinux log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-lumalinux-log
          path: |
            /tmp/fakehome/.cache/lumalinux/lumalinux.log
            steam-stdout.log
