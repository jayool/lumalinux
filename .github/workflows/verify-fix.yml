name: Verify Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake ninja-build pkg-config \
            libcurl4-openssl-dev:i386 libssl-dev:i386

      - name: Fetch libmem
        run: ./tools/fetch_libmem.sh

      - name: Build liblumalinux.so with fix
        run: |
          mkdir -p build
          cd build
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -v
          file liblumalinux.so

      - name: Download test deps from test-deps-v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deck-env
          cd deck-env
          gh release download test-deps-v1 --repo jayool/lumalinux --pattern "*.tar.gz"
          ls -lh
          mkdir -p sos harness steam-tree
          tar xzf sos_binaries.tar.gz -C sos
          tar xzf harness.tar.gz -C harness
          tar xzf steam_ubuntu12_32.tar.gz -C steam-tree
          ls sos/
          ls harness/

      - name: Set up fake HOME
        run: |
          mkdir -p /tmp/fakehome/.local/share/SLSsteam
          mkdir -p /tmp/fakehome/.local/share/CloudRedirect
          mkdir -p /tmp/fakehome/.local/share/lumalinux
          mkdir -p /tmp/fakehome/.config/SLSsteam
          cp deck-env/sos/SLSsteam.so /tmp/fakehome/.local/share/SLSsteam/
          cp deck-env/sos/library-inject.so /tmp/fakehome/.local/share/SLSsteam/
          cp deck-env/sos/cloud_redirect.so /tmp/fakehome/.local/share/CloudRedirect/
          # USE the FRESH liblumalinux.so from the build, not the old one
          cp build/liblumalinux.so /tmp/fakehome/.local/share/lumalinux/
          cp deck-env/harness/fix_atexit.so /tmp/fakehome/.local/share/lumalinux/
          ls -la /tmp/fakehome/.local/share/lumalinux/
          file /tmp/fakehome/.local/share/lumalinux/liblumalinux.so
          
          cat > /tmp/fakehome/.config/SLSsteam/config.yaml <<'EOF'
          PlayNotOwnedGames: no
          SafeMode: no
          DisableCloud: no
          NotifyInit: no
          Notifications: no
          warnHashMissmatch: no
          AdditionalApps: []
          AppIds: []
          EOF

          mkdir -p /tmp/fakehome/.steam
          ln -sf /tmp/fakehome/.local/share/Steam /tmp/fakehome/.steam/steam
          mkdir -p /tmp/fakehome/.local/share/Steam
          ln -sf $PWD/deck-env/steam-tree/ubuntu12_32 /tmp/fakehome/.local/share/Steam/ubuntu12_32

      - name: Run matrix
        run: |
          cd deck-env/steam-tree/ubuntu12_32
          set +e
          ulimit -c 0
          N=30
          LIB_INJECT=/tmp/fakehome/.local/share/SLSsteam/library-inject.so
          SLS=/tmp/fakehome/.local/share/SLSsteam/SLSsteam.so
          CR=/tmp/fakehome/.local/share/CloudRedirect/cloud_redirect.so
          LUMA=/tmp/fakehome/.local/share/lumalinux/liblumalinux.so
          
          run_test() {
            local name="$1"
            local audit="$2"
            local preload="$3"
            local PASS=0 FAIL=0 SIGABRT=0 OTHER=0
            for i in $(seq 1 $N); do
              HOME=/tmp/fakehome LD_LIBRARY_PATH="/usr/lib32" \
              LD_AUDIT="$audit" LD_PRELOAD="$preload" \
                timeout 25 ./steam -nominidumps -nobreakpad > /dev/null 2>&1
              EX=$?
              if [ $EX -eq 0 ]; then PASS=$((PASS+1));
              elif [ $EX -eq 134 ]; then FAIL=$((FAIL+1)); SIGABRT=$((SIGABRT+1));
              else FAIL=$((FAIL+1)); OTHER=$((OTHER+1)); fi
            done
            echo "$name: PASS=$PASS FAIL=$FAIL (SIGABRT=$SIGABRT, OTHER=$OTHER)" | tee -a /tmp/results.txt
          }
          
          echo "## Verify Fix Results (N=$N runs each)" > /tmp/results.txt
          echo "" >> /tmp/results.txt
          echo "### Control (no fix expected — old behavior)" >> /tmp/results.txt
          run_test "SLSsteam + CR (no luma)             " "$LIB_INJECT:$SLS" "$CR"
          
          echo "" >> /tmp/results.txt
          echo "### With FRESH liblumalinux.so (atexit fix)" >> /tmp/results.txt
          run_test "SLSsteam + CR + FRESH luma          " "$LIB_INJECT:$SLS" "$LUMA:$CR"
          run_test "SLSsteam + FRESH luma SOLO          " "$LIB_INJECT:$SLS" "$LUMA"
          run_test "FRESH luma SOLO                     " "" "$LUMA"
          
          cat /tmp/results.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: /tmp/results.txt


