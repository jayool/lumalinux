name: Runtime smoke test (loads lumalinux, checks hooks)

# Manual runtime smoke test: build a fresh liblumalinux.so, load it into a real
# Steam process against the CURRENT steamclient.so + CURRENT SLSsteam/CloudRedirect,
# and assert it LOADS, INSTALLS ITS HOOKS, and doesn't crash.
#
# This is the ONLY test that actually RUNS the .so. build.yml only compiles, and
# check_patterns.py only resolves statically — so a change that compiles and
# resolves on paper but crashes or fails to hook at runtime (e.g. a bad memory
# read in a new resolver — the DepotKey derive-by-signature risk in v0.16.18) is
# invisible to them. This starts the engine.
#
# Self-contained: it fetches EVERYTHING current at run time — the whole 32-bit
# client tree (fetch_steamclient.py --extract-tree, same manifest as the
# steamclient.so we hook, so tree and library are consistent), SLSsteam +
# library-inject (AceSLS latest), and CloudRedirect (linux-test). Nothing is
# pinned any more: the 329 MB steam_ubuntu12_32.tar.gz from test-deps-v1 is
# gone, along with the three-month drift between that frozen tree and today's
# client library.
#
# HISTORY, so nobody re-derives it: this file was born to verify ONE fix (the
# atexit crash) and was later rewritten into a full-stack harness that was never
# actually run. Its first real execution — 2026-09-08, run 6 — failed with all
# five Steam attempts timing out and steamclient.so never mapped, i.e. every
# assertion in it had been decorative. It now loads the client library in a
# purpose-built 32-bit host instead of trying to boot Steam; see the comment on
# that step for what that trades away.
#
# Manual only — heavy. Run before a release, or after touching hooking code
# (rtti.cpp, hooks/, lmhook.cpp, main.cpp, patterns). Checks out the dispatched
# ref, so you can validate a branch/tag BEFORE merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # dispatched ref (branch/tag/PR head) — validate BEFORE merge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake ninja-build pkg-config \
            libcurl4-openssl-dev:i386 libssl-dev:i386 p7zip-full wget

      - name: Fetch libmem
        run: ./tools/fetch_libmem.sh

      - name: Build liblumalinux.so (SafeMode gate OFF)
        # Default LUMA_NO_UPDATE (ON here) compiles OUT the hash gate, so the hooks
        # install regardless of whether this steamclient's hash is whitelisted — we
        # want to exercise the HOOK-INSTALL code, not the whitelist.
        run: |
          mkdir -p build && cd build
          PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -v
          file liblumalinux.so

      - name: Fetch the CURRENT steamclient.so
        run: |
          python3 tools/fetch_steamclient.py --output current-steamclient.so
          echo "current steamclient.so:"; sha256sum current-steamclient.so

      - name: Fetch CURRENT SLSsteam + CloudRedirect, build fix_atexit shim
        run: |
          mkdir -p sos && cd sos
          # SLSsteam (latest release): SLSsteam.so + library-inject.so.
          # The asset name changed upstream (SLSsteam-Any.7z -> per-variant
          # SLSsteam-Any-release.7z / -debug.7z, first shipped in 20260819131545),
          # so try the current name and fall back to the legacy one instead of
          # 404ing. Mirrors resolve_slssteam_asset() in setup.sh.
          TAG=$(curl -sSL -o /dev/null -w "%{url_effective}" "https://github.com/AceSLS/SLSsteam/releases/latest")
          TAG="${TAG##*/}"; echo "SLSsteam latest: $TAG"
          for ASSET in SLSsteam-Any-release.7z SLSsteam-Any.7z; do
            URL="https://github.com/AceSLS/SLSsteam/releases/download/$TAG/$ASSET"
            if wget -q "$URL" -O SLSsteam.7z; then echo "SLSsteam asset: $ASSET"; break; fi
            rm -f SLSsteam.7z
          done
          [ -s SLSsteam.7z ] || { echo "::error::No SLSsteam archive found in release $TAG (renamed again?)"; exit 1; }
          7z x -y SLSsteam.7z >/dev/null
          cp bin/SLSsteam.so SLSsteam.so
          cp bin/library-inject.so library-inject.so
          # CloudRedirect (linux-test channel)
          wget -q https://github.com/Selectively11/h3adcr-b/releases/download/linux-test/cloud_redirect.so -O cloud_redirect.so
          # fix_atexit shim (forces a clean _exit at shutdown; harmless if unneeded)
          cat > fix_atexit.c <<'EOF'
          #include <stdlib.h>
          #include <unistd.h>
          static void e(void){_exit(0);}
          __attribute__((constructor)) static void r(void){atexit(e);}
          EOF
          gcc -m32 -shared -fPIC -o fix_atexit.so fix_atexit.c
          echo "fetched:"; ls -la SLSsteam.so library-inject.so cloud_redirect.so fix_atexit.so

      # The whole 32-bit client tree, from the SAME manifest steamclient.so comes
      # from — so it is current and self-consistent. This replaces a 329 MB
      # steam_ubuntu12_32.tar.gz pinned in the test-deps-v1 release (uploaded
      # 2026-06-13, never refreshed) that had the current steamclient.so dropped
      # on top of it: a three-month-old tree carrying a brand-new client library.
      - name: Fetch the CURRENT 32-bit client tree
        run: |
          python3 tools/fetch_steamclient.py --extract-tree deck-env
          echo "tree:"; ls -la deck-env/ubuntu12_32 | head -20
          test -f deck-env/ubuntu12_32/steamclient.so \
            || { echo "ERROR: no steamclient.so in the extracted tree"; exit 1; }

      - name: Set up fake HOME
        run: |
          mkdir -p /tmp/fakehome/.local/share/SLSsteam /tmp/fakehome/.local/share/CloudRedirect \
                   /tmp/fakehome/.local/share/lumalinux /tmp/fakehome/.config/SLSsteam \
                   /tmp/fakehome/.cache/lumalinux
          cp sos/SLSsteam.so        /tmp/fakehome/.local/share/SLSsteam/
          cp sos/library-inject.so  /tmp/fakehome/.local/share/SLSsteam/
          cp sos/cloud_redirect.so  /tmp/fakehome/.local/share/CloudRedirect/
          cp build/liblumalinux.so  /tmp/fakehome/.local/share/lumalinux/
          cp sos/fix_atexit.so      /tmp/fakehome/.local/share/lumalinux/
          cat > /tmp/fakehome/.config/SLSsteam/config.yaml <<'EOF'
          PlayNotOwnedGames: no
          SafeMode: no
          DisableCloud: no
          NotifyInit: no
          Notifications: no
          warnHashMissmatch: no
          AdditionalApps: []
          AppIds: []
          EOF
          mkdir -p /tmp/fakehome/.steam /tmp/fakehome/.local/share/Steam
          ln -sf /tmp/fakehome/.local/share/Steam /tmp/fakehome/.steam/steam
          ln -sf "$PWD/deck-env/ubuntu12_32" /tmp/fakehome/.local/share/Steam/ubuntu12_32

      # WHY A dlopen HOST AND NOT THE REAL CLIENT.
      # This step used to run `./steam` straight out of the pinned tree, with all
      # output sent to /dev/null. On its first ever execution (2026-09-08, run 6
      # — the rewritten workflow had never actually run) all five attempts hit
      # the 25 s timeout without steamclient.so ever being mapped, so every
      # assertion below was reporting on a process that never got started
      # properly. Running the ubuntu12_32 binary directly skips steam.sh and the
      # Steam runtime that a real Deck goes through, and diagnosing it was
      # impossible with the output discarded.
      #
      # What the resolvers actually need is steamclient.so MAPPED IN A 32-BIT
      # PROCESS: lumalinux's LD_PRELOAD path polls /proc/self/maps and installs
      # the hooks itself (src/main.cpp, LumalinuxCtor) — Steam does nothing
      # special for it. So the host just dlopen()s the library and waits.
      # Deterministic, seconds instead of minutes, and it exercises the real C++
      # against the real binary.
      #
      # COVERAGE GIVEN UP, stated plainly: no Steam threads mutating the package
      # cache, and no logged-in session — so package 0 is never found and the
      # finder is only asserted as far as resolving its address. Restoring the
      # full-stack run needs a fresh bootstrap tree and a launch path that
      # mirrors steam.sh; run B below keeps the stack in view meanwhile.
      - name: Load the current steamclient.so in a 32-bit host
        run: |
          gcc -m32 -Wall -Wextra -o smoke_dlopen tools/smoke_dlopen.c -ldl
          SC="$PWD/deck-env/ubuntu12_32/steamclient.so"
          CR=/tmp/fakehome/.local/share/CloudRedirect/cloud_redirect.so
          LIB_INJECT=/tmp/fakehome/.local/share/SLSsteam/library-inject.so
          SLS=/tmp/fakehome/.local/share/SLSsteam/SLSsteam.so
          LUMA=/tmp/fakehome/.local/share/lumalinux/liblumalinux.so
          rm -f /tmp/fakehome/.cache/lumalinux/lumalinux.log
          ulimit -c 0
          set +e

          # Run A — lumalinux alone. This is the one that gets asserted.
          echo "── run A: lumalinux only ──"
          HOME=/tmp/fakehome LUMA_PROCESS_ANY=1 \
          LD_LIBRARY_PATH="$PWD/deck-env/ubuntu12_32:/usr/lib32" \
          LD_PRELOAD="$LUMA" \
            timeout 60 ./smoke_dlopen "$SC" 15 2>&1 | tee run-a.log
          exA=${PIPESTATUS[0]}; echo "run A exit=$exA"

          # Run B — the full stack, same env a Deck sets (setup.sh
          # luma_set_injection_env). INFORMATIONAL: reported, never fatal, since
          # SLSsteam expects to be inside Steam and this host is not.
          echo "── run B: full stack (informational) ──"
          HOME=/tmp/fakehome LUMA_PROCESS_ANY=1 \
          LD_LIBRARY_PATH="$PWD/deck-env/ubuntu12_32:/usr/lib32" \
          LD_AUDIT="$LIB_INJECT:$SLS" LD_PRELOAD="$LUMA:$CR" \
            timeout 60 ./smoke_dlopen "$SC" 15 2>&1 | tee run-b.log
          echo "run B exit=${PIPESTATUS[0]} (informational)"

          set -e
          crashes=0
          [ "$exA" -eq 134 ] && crashes=1
          echo "crashes(SIGABRT, run A)=$crashes"
          echo "crashes=$crashes" >> "$GITHUB_ENV"
          echo "exA=$exA" >> "$GITHUB_ENV"

      - name: Assert loaded + hooks installed + no crash
        run: |
          LOG=/tmp/fakehome/.cache/lumalinux/lumalinux.log
          echo "── lumalinux log tail ──"
          tail -50 "$LOG" 2>/dev/null || { echo "FAIL: no log — lumalinux never ran / steamclient.so never mapped"; exit 1; }
          echo "────────────────────────"
          # Tell a HARNESS failure apart from OURS. Both used to print the same
          # "did not install its hooks", which on 2026-09-08 sent the diagnosis
          # off after a red herring: Steam had never mapped steamclient.so at
          # all, so the hooks were never given anything to install against.
          test "${exA:-1}" -eq 0 \
            || { echo "HARNESS FAIL: the dlopen host itself exited ${exA} — see run-a.log; steamclient.so was never mapped, so nothing below was even attempted"; exit 1; }
          grep -aqE 'steamclient.so detected|installing hooks' "$LOG" \
            || { echo "HARNESS FAIL: lumalinux ran but never saw steamclient.so in /proc/self/maps — the host mapped it, so this is the poller or the process gate (LUMA_PROCESS_ANY), not the hooks"; exit 1; }
          grep -aqE 'hooks active' "$LOG" \
            || { echo "FAIL: steamclient.so WAS mapped and lumalinux saw it, but no 'X/X hooks active' — this one is ours"; exit 1; }
          grep -aqE 'name=DepotKey .*outcome=installed' "$LOG" \
            || { echo "FAIL: DepotKey did not install"; exit 1; }
          # The package-0 finder is the SOLE depot injector, and until now this
          # smoke test — the only thing that actually runs the .so — said nothing
          # about it. Everything it does is exactly what this workflow exists to
          # catch: it derives addresses at runtime and then READS AND WRITES
          # through them, which is precisely the "bad memory read in a new
          # resolver" case named at the top of this file.
          #
          # Package 0 itself cannot be found here (that needs a logged-in Steam
          # with a licence set), so the assertion stops at the resolution step:
          # the finder must reach a cache address. That is the one line that
          # survives whichever resolver wins — method=rva when the feed carries
          # this build's disp, method=scan when it does not — so it does not have
          # to be rewritten every time the resolver chain changes.
          echo "── package-0 finder ──"
          grep -aE 'PKG0_FINDER|Finder resolve:' "$LOG" || echo "(no finder lines at all)"
          echo "──────────────────────"
          grep -aqE 'Finder resolve: name=PKG0Finder .*outcome=resolved' "$LOG" \
            || { echo "FAIL: the package-0 finder resolved no cache address — see the finder lines above for which anchor failed (GOT or the cache-access idiom) and whether it was NOT_FOUND or AMBIGUOUS"; exit 1; }
          test "${crashes:-1}" -eq 0 || { echo "FAIL: ${crashes} SIGABRT crash(es)"; exit 1; }
          echo "PASS: lumalinux loaded, DepotKey + hooks installed, package-0 finder resolved its cache address against the CURRENT steamclient, no crash."

      - name: Upload lumalinux log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-lumalinux-log
          path: |
            /tmp/fakehome/.cache/lumalinux/lumalinux.log
            run-a.log
            run-b.log
